# kapadiaschool-astro.conf — sites-enabled snippet for Astro + Django.
# Installed by astro.sh / deploy.sh to /etc/nginx/sites-enabled/kapadiaschool
# (with timestamped backup). Replaces the Django-only vhost, keeps the same
# 3-block SSL layout: port-80 IP block, 443 main block, port-80 redirect block.
#
# Layout: Astro static (frontend/dist) serves all pages;
# Django (gunicorn 127.0.0.1:8000) keeps /admin/, /api/, files.

server {
    listen 80;
    server_name 72.60.203.238;
    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/deploy/test/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /gallery/ {
        alias /home/deploy/test/gallery/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }
}
server {
    server_name 72.60.203.238 srv1048154.hstgr.cloud kapadiahighschool.com www.kapadiahighschool.com;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Django admin + JSON API (Astro contact form posts /api/contact/)
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    location /static/ {
        alias /home/deploy/test/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /media/ {
        alias /home/deploy/test/gallery/;
        expires 7d;
        add_header Cache-Control "public";
        client_max_body_size 10M;
    }
    location /gallery/ {
        alias /home/deploy/test/gallery/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Astro hashed assets — immutable
    location /_astro/ {
        alias /home/deploy/test/frontend/dist/_astro/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Astro static pages (frontend/dist from `npm run build`)
    location / {
        root /home/deploy/test/frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/kapadiahighschool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kapadiahighschool.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = www.kapadiahighschool.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = kapadiahighschool.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name 72.60.203.238 srv1048154.hstgr.cloud kapadiahighschool.com www.kapadiahighschool.com;
    return 404;
}
