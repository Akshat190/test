version: '3.8'

services:
  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - media:/app/gallery
      - static:/app/staticfiles
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - django

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - media:/media:ro
      - static:/static:ro
    depends_on:
      - frontend
      - django

volumes:
  postgres_data:
  media:
  static:
