events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    upstream django {
        server unix:/home/deploy/test/run/gunicorn.sock fail_timeout=0;
    }

    server {
        listen 80;
        server_name kapadiahighschool.com www.kapadiahighschool.com;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name kapadiahighschool.com www.kapadiahighschool.com;

        ssl_certificate /etc/letsencrypt/live/kapadiahighschool.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapadiahighschool.com/privkey.pem;

        # Security
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

        # Django Admin & API
        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django media files
        location /media/ {
            alias /home/deploy/test/gallery/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Django static files
        location /static/ {
            alias /home/deploy/test/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Prometheus — restrict to internal network and monitoring IPs
        location /metrics/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://django;
            proxy_set_header Host $host;
        }

        # Astro frontend (static files)
        location / {
            root /home/deploy/test/frontend/dist;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # Astro asset hashing
        location /_astro/ {
            root /home/deploy/test/frontend/dist;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
