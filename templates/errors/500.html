{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - Kapadia High School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: 'Outfit', sans-serif; }
        .error-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-code { font-size: 8rem; font-weight: 700; color: #dc3545; }
        .error-message { color: #6b7280; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="text-center">
            <div class="error-code">500</div>
            <h2 class="mb-3">Something Went Wrong</h2>
            <p class="error-message">We are experiencing technical difficulties. Please try again later.</p>
            <a href="{% url 'home' %}" class="btn btn-primary mt-3">Go Back Home</a>
        </div>
    </div>
</body>
</html>
