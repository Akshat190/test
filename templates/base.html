<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kapadia High School{% endblock title %}</title>
    {% load static %}
    
    <!-- Preload critical resources -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" as="style">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts - Elegant pairing -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="{% static 'css/base.css' %}" rel='stylesheet' type='text/css'>
    <link href="{% static 'css/image-styles.css' %}" rel='stylesheet' type='text/css'>
    <link href="{% static 'css/footer.css' %}" rel='stylesheet' type='text/css'>
    <link href="{% static 'css/sticky-footer.css' %}" rel='stylesheet' type='text/css'>
    
    <!-- Meta tags for SEO and performance -->
    <meta name="description" content="{% block meta_description %}Kapadia High School - Excellence in Education Since 1956. A co-educational English medium school in Gujarat, India.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}Kapadia High School, CBSE School, GSEB School, Gujarat, Education, Best School{% endblock %}">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#003264">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://kapadiahighschool.com{{ request.path }}">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Kapadia High School{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Excellence in Education Since 1956{% endblock %}">
    <meta property="og:url" content="https://kapadiahighschool.com{{ request.path }}">
    <meta property="og:site_name" content="Kapadia High School">
    <meta property="og:image" content="{% block og_image %}https://kapadiahighschool.com/static/images/placeholder.jpg{% endblock %}">
    <meta property="og:locale" content="en_IN">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Kapadia High School{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Excellence in Education Since 1956{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}https://kapadiahighschool.com/static/images/placeholder.jpg{% endblock %}">
    
    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Kapadia High School",
        "alternateName": "KHS",
        "description": "Excellence in Education Since 1956",
        "url": "https://kapadiahighschool.com",
        "logo": "https://kapadiahighschool.com/static/images/favicon/favicon-32x32.png",
        "foundingDate": "1956",
        "address": {
            "@type": "PostalAddress",
            "streetAddress": "Near Chhatral Railway Station",
            "addressLocality": "Kalol",
            "addressRegion": "Gujarat",
            "postalCode": "382721",
            "addressCountry": "IN"
        },
        "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+91-6354368335",
            "contactType": "admissions",
            "email": "info@kapadiahighschool.com"
        },
        "sameAs": [
            "https://www.instagram.com/_tirth._.shah_"
        ]
    }
    </script>
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/favicon/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'images/favicon/site.webmanifest' %}">
    <link rel="shortcut icon" href="{% static 'images/favicon/favicon.ico' %}">
    
    {% block page_css %}{% endblock page_css %}

    <style>
        html { scroll-behavior: smooth; }
        ::selection { background: #D4AF37; color: #003264; }
        .skip-link {
            position: absolute; left: -9999px; top: 0; z-index: 2000;
            background: #D4AF37; color: #003264; padding: 8px 16px;
        }
        .skip-link:focus { left: 8px; top: 8px; }
        @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <!-- Scroll to top button -->
    <button id="scrollToTop" class="scroll-to-top" aria-label="Scroll to top">
        <i class="fas fa-arrow-up"></i>
    </button>
    <!-- Header -->
    {% include 'header.html' %}
    
    <!-- Carousel Block -->
    <div class="carousel-container">
        {% block carousel %}{% endblock carousel %}
    </div>
    
    <!-- Main Content -->
    <main id="main-content" class="container mt-4 mb-0 flex-grow-1">
        <div class="content-wrapper">
            {% block content %}{% endblock content %}
        </div>
    </main>
    
    <!-- Footer -->
    {% include 'footer.html' %}

  <!-- Bootstrap JS Bundle - defer loading until page is rendered -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>

  <!-- Custom JavaScript - defer loading -->
  <script src="{% static 'js/main.js' %}" defer></script>

  <!-- Page-specific JavaScript -->
  {% block page_js %}
  {% endblock page_js %}
</body>

</html>
